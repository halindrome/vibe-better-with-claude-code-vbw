<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1290" width="1320" height="1290" role="img" aria-labelledby="title desc">
  <title id="title">How much checking each phase gets</title>
  <desc id="desc">VBW sizes up your request before any planning. A small, safe change is planned by VBW itself: one plan, one check, one approval, one Dev, and a quick QA or none when everything is proven. Anything bigger goes through planning, where the Architect and the Lead plan it and each phase gets a floor from its size, its risk and the proven work it could break. A standard phase gets a Dev for every plan, each breaking its own code once per rule so a test must notice, then QA. A deep phase adds a Scout first, more breaks and a deep QA. While a phase runs, trouble raises its tier one step with the reason recorded; a risk path goes straight to deep; a tier is never lowered once work begins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF6"/>
      <stop offset="1" stop-color="#F6F3FB"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C40CF"/>
      <stop offset="1" stop-color="#30299A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8DE97"/>
      <stop offset="1" stop-color="#EFC968"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2E2770" flood-opacity="0.13"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B2940"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1F1D33; font-size: 27px; text-anchor: middle; }
      .b { font-weight: 700; }
      .w { fill: #FFFFFF; }
      .chip text { font-size: 25px; fill: #34324A; }
      .box { fill: #E9E5FD; stroke: #9C8FE6; stroke-width: 2; }
      .cont { fill: #FFF8E4; stroke: #EBCF7E; stroke-width: 2; }
      .chipr { fill: #F3F1EE; stroke: #E4E0DA; stroke-width: 1.5; }
      .ln { stroke: #2B2940; stroke-width: 2.4; fill: none; }
    </style>
  </defs>

  <rect width="1320" height="1290" rx="28" fill="url(#bg)"/>

  <!-- Request -->
  <rect x="520" y="30" width="280" height="76" rx="38" fill="url(#ink)" filter="url(#sh)"/>
  <text x="660" y="78" class="w" style="font-size:30px">Your request</text>
  <path class="ln" d="M660 106 V146" marker-end="url(#ah)"/>

  <!-- Size it up -->
  <rect class="box" x="300" y="150" width="720" height="160" rx="18" filter="url(#sh)"/>
  <text x="660" y="204"><tspan class="b">SIZE IT UP</tspan> · before any planning</text>
  <text x="660" y="246">how many requirements and files, risk words</text>
  <text x="660" y="284">(payments, sign-in, secrets…), the project's size</text>

  <!-- Split -->
  <path class="ln" d="M660 310 V336 H250 V446" marker-end="url(#ah)"/>
  <path class="ln" d="M660 336 H885 V446" marker-end="url(#ah)"/>
  <g class="chip">
    <rect class="chipr" x="155" y="364" width="190" height="46" rx="23"/>
    <text x="250" y="396">small and safe</text>
    <rect class="chipr" x="790" y="364" width="190" height="46" rx="23"/>
    <text x="885" y="396">anything more</text>
  </g>

  <!-- Small change -->
  <rect class="box" x="50" y="450" width="400" height="460" rx="18" filter="url(#sh)"/>
  <text x="250" y="514" class="b">SMALL CHANGE</text>
  <text x="250" y="564">VBW plans it itself:</text>
  <text x="250" y="606">one plan, one check</text>
  <text x="250" y="648">that fails today,</text>
  <text x="250" y="690">one approval from you,</text>
  <text x="250" y="732">one Dev builds it.</text>
  <text x="250" y="792">QA: a quick look, or none</text>
  <text x="250" y="834">when everything is proven</text>

  <!-- Planning -->
  <rect class="box" x="500" y="450" width="770" height="200" rx="18" filter="url(#sh)"/>
  <text x="885" y="504"><tspan class="b">PLANNING</tspan> · the Architect, then the Lead</text>
  <text x="885" y="548">plans with checks that fail today; each phase</text>
  <text x="885" y="588">gets a floor from its size, its risk and the</text>
  <text x="885" y="628">proven work it could break</text>
  <path class="ln" d="M685 650 V676" marker-end="url(#ah)"/>
  <path class="ln" d="M1085 650 V676" marker-end="url(#ah)"/>

  <!-- Standard -->
  <rect class="cont" x="500" y="680" width="370" height="230" rx="18" filter="url(#sh)"/>
  <text x="685" y="730" class="b">STANDARD</text>
  <text x="685" y="776">a Dev for every plan;</text>
  <text x="685" y="816">each breaks its own code</text>
  <text x="685" y="856">once per rule: a test</text>
  <text x="685" y="896">must notice. Then QA.</text>

  <!-- Deep -->
  <rect x="900" y="680" width="370" height="230" rx="18" fill="url(#gold)" stroke="#D9B04E" stroke-width="2" filter="url(#sh)"/>
  <text x="1085" y="730" class="b">DEEP</text>
  <text x="1085" y="776">a Scout researches first,</text>
  <text x="1085" y="816">a Dev for every plan,</text>
  <text x="1085" y="856">more breaks on purpose,</text>
  <text x="1085" y="896">then a deep QA.</text>

  <!-- Escalation -->
  <rect class="cont" x="50" y="960" width="1220" height="280" rx="22" filter="url(#sh)"/>
  <text x="660" y="1010"><tspan class="b">ESCALATION</tspan> · while a phase runs</text>
  <rect x="330" y="1034" width="180" height="56" rx="28" fill="#E9E5FD" stroke="#9C8FE6" stroke-width="2"/>
  <text x="420" y="1071">express</text>
  <path class="ln" d="M512 1062 H566" marker-end="url(#ah)"/>
  <rect x="570" y="1034" width="180" height="56" rx="28" fill="#FFF3CF" stroke="#E2BE5E" stroke-width="2"/>
  <text x="660" y="1071">standard</text>
  <path class="ln" d="M752 1062 H806" marker-end="url(#ah)"/>
  <rect x="810" y="1034" width="180" height="56" rx="28" fill="url(#gold)" stroke="#D9B04E" stroke-width="2"/>
  <text x="900" y="1071">deep</text>
  <text x="660" y="1136">Trouble raises the tier one step, reason recorded: a blocked plan,</text>
  <text x="660" y="1174">a fix or QA that needs another round, a plan that grew, proven work</text>
  <text x="660" y="1212">that broke. A risk path goes straight to deep. <tspan class="b">Never lowered.</tspan></text>
</svg>
