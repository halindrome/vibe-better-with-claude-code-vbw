name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  test:
    name: Tests (${{ matrix.name }}${{ matrix.shard && format(', shard {0} of 4', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        shard: [1, 2, 3, 4]
        include:
          # macOS ships /bin/bash 3.2; that is the kernel's floor (build plan K2).
          - name: macOS, /bin/bash 3.2
            os: macos-latest
            bash_path: /bin
          - name: Linux, bash 5
            os: ubuntu-latest
            bash_path: /usr/bin
          - name: Linux, bash 5 (Ubuntu 26.04)
            os: ubuntu-26.04
            bash_path: /usr/bin
    steps:
      # Check out into a path containing a space: v1 had test and script bugs
      # that only a path like this exposes (ledger T2).
      - uses: actions/checkout@v7
        with:
          path: src dir
          # The whole history, so the previous tip can be compared; a shallow
          # clone would always mean the full suite.
          fetch-depth: 0

      - name: Install test tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core shellcheck jq parallel
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats shellcheck jq parallel
          fi

      - name: Decide what to test
        id: scope
        shell: bash
        working-directory: src dir
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATH="${{ matrix.bash_path }}:$PATH"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # No merge base found means an empty base, which means the full suite.
            BASE=$(git merge-base "$PR_BASE" "$PR_HEAD" || true)
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          bash tools/ci-scope.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

      - name: Run the suite with the target bash first on PATH
        if: steps.scope.outputs.scope != 'some' && steps.scope.outputs.scope != 'none'
        working-directory: src dir
        env:
          # The panel budget (0.5 ms of CPU per refresh) is calibrated on a developer Mac.
          VBW_PANEL_BUDGET_MS: "3"
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          export PATH="${{ matrix.bash_path }}:$PATH"
          bash --version | head -1
          # The timed speed checks run here, in the release run, and never in vbw prove.
          if [ -n "$SHARD" ]; then
            bash tools/test.sh --shard "$SHARD/$SHARDS"
          else
            bash tools/test.sh --release
          fi

      - name: Run the changed test files with the target bash first on PATH
        if: steps.scope.outputs.scope == 'some' && (!matrix.shard || matrix.shard == 1)
        working-directory: src dir
        env:
          FILES: ${{ steps.scope.outputs.files }}
          VBW_PANEL_BUDGET_MS: "3"
        run: |
          export PATH="${{ matrix.bash_path }}:$PATH"
          bash --version | head -1
          # shellcheck disable=SC2086
          bats --print-output-on-failure $FILES

  validate:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate plugin and marketplaces
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugin
          claude plugin validate .
          node --check plugin/workflows/*.js 2>/dev/null || [ -z "$(ls plugin/workflows/*.js 2>/dev/null)" ]
